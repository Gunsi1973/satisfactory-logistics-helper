# Satisfactory Logistics Helper - Grist + FRM sync
#
# Grist (relational spreadsheet) holds the plan; frm-sync reads the live game
# state from the Ficsit Remote Monitoring (FRM) mod and writes it into Grist.
#
# Single-user mode without login: GRIST_DEFAULT_EMAIL is used for every request
# without credentials, GRIST_IN_SERVICE=true skips the quick-setup wizard.
# That is why the port is bound to 127.0.0.1 by default. Setting GRIST_BIND to a
# LAN IP gives everyone on the LAN full access.
#
# Image grist-oss: open-source part only. The version is pinned because Grist
# migrates its home database on start (forward only).
#
# Data: ./persist holds home.sqlite3 (users, workspaces) and docs/*.grist (the
# documents, plain SQLite). Backup: copy ./persist while the stack is stopped,
# or use "Download -> Download document" in Grist.
#
# Networking: by default the sync runs in Docker's bridge network and reaches
# FRM on the host via host.docker.internal (works on Docker Desktop for
# Windows/macOS and on Linux without a blocking firewall). Linux hosts whose
# firewall (e.g. ufw) blocks bridge-to-host traffic add
# docker-compose.hostnet.yml, see README.

services:

  satisfactory-grist:
    image: gristlabs/grist-oss:${GRIST_TAG}
    container_name: satisfactory-grist
    restart: unless-stopped
    environment:
      - TZ=${TZ}                                  # time zone for logs and timestamps
      - GRIST_DEFAULT_EMAIL=${GRIST_DEFAULT_EMAIL}  # identity for requests without login
      - GRIST_IN_SERVICE=true                     # skip the quick-setup wizard
      - GRIST_SINGLE_ORG=docs                     # personal site only, no site switching
      - GRIST_ORG_IN_PATH=true                    # org in the URL path, not as subdomain
      - GRIST_HIDE_UI_ELEMENTS=billing,createSite,multiSite,multiAccounts,supportGrist,tutorials
      - GRIST_TELEMETRY_LEVEL=off
      - GRIST_DEFAULT_LOCALE=en
    ports:
      - ${GRIST_BIND}:${GRIST_PORT}:8484          # web UI and REST API
    volumes:
      - ./persist:/persist                        # home.sqlite3 and docs/*.grist

  # ---------------------------------------------------------------------
  # frm-sync - reads stations, platforms and trains from FRM and writes
  # them into Grist every SYNC_INTERVAL seconds.
  #
  # Independent of Grist: Grist does not depend on this service. If FRM is
  # unreachable, the last data stays and Sync_Status says so. The service
  # never crashes on errors.
  #
  # No custom image: python:alpine plus the script as read-only mount,
  # standard library only. After editing the script:
  # docker compose restart satisfactory-frm-sync
  # ---------------------------------------------------------------------
  satisfactory-frm-sync:
    image: python:${PYTHON_TAG}
    container_name: satisfactory-frm-sync
    restart: unless-stopped
    init: true                                    # proper signal handling, fast stop
    command: ["python", "-u", "/app/sync.py"]
    extra_hosts:
      - host.docker.internal:host-gateway         # host address on Linux (built in on Docker Desktop)
    environment:
      - TZ=${TZ}
      - FRM_URL=${FRM_URL}                        # FRM web server in the game
      - GRIST_URL=http://satisfactory-grist:8484  # Grist inside the compose network
      - GRIST_DOC_ID=${GRIST_DOC_ID}              # Grist document ID
      - GRIST_API_KEY=${GRIST_API_KEY}            # Grist: Profile Settings -> API key
      - SYNC_INTERVAL=${SYNC_INTERVAL}            # seconds between two syncs
    volumes:
      - ./frm-sync/sync.py:/app/sync.py:ro
